# configure with a .env file next to this one (copy .env.example); docker compose only reads one
# from here, server/.env isn't used by this
services:
  mangaviewer:
    # `docker compose pull && docker compose up -d` uses the image published by the
    # github action; `docker compose up -d --build` builds it locally instead
    image: ghcr.io/rishi-bidani/mangaviewer:latest
    build: .
    container_name: mangaviewer
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    # these and the defaults are all of the configuration; the server prints every setting when it
    # starts
    environment:
      IGNORE_LIST: ${IGNORE_LIST:-}
      FETCH_METADATA: ${FETCH_METADATA:-false}
      ENABLED_EXTENSIONS: ${ENABLED_EXTENSIONS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    volumes:
      - "${MANGA_DIR:?set MANGA_DIR in .env to the folder your manga is in}:/manga:ro"
      # keeps the database and fetched covers across container updates
      - metadata:/data
      # read-only, so an extension can't change itself or the others
      - "${EXTENSIONS_DIR:-./extensions}:/data/extensions:ro"

volumes:
  metadata:
