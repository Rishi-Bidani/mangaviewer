name: Release

# runs when a version tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/rishi-bidani/mangaviewer with :1.2.3, :1.2, :sha-xxxxxxx and :latest
      # (semver tags get :latest automatically)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  executables:
    # macOS so the darwin executables get ad-hoc signed (Apple Silicon refuses unsigned ones);
    # the windows and linux ones are cross-compiled from here too
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # building executables needs Node.js 25.7+
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bundle

      # creates the GitHub release for the tag with release/mangaviewer-* attached
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
